<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARIA">
  <meta name="theme-color" content="#060A14">
  <title>ARIA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #060A14; --surface: #0C1220; --border: #111D30;
      --blue: #1A8CFF; --cyan: #00D4FF; --green: #00E87A;
      --amber: #FFB800; --red: #FF4455; --text: #DCE8FF;
      --muted: #4A5E80; --dim: #1E2E48;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    .screen.active { opacity: 1; pointer-events: all; }
    #main { background: var(--bg); }
    .main-header { display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header-brand .name { font-size: 22px; font-weight: 700; letter-spacing: 0.18em; color: var(--cyan); text-shadow: 0 0 20px rgba(0,212,255,0.35); }
    .header-brand .status-row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s; }
    .status-text { font-size: 9px; letter-spacing: 0.18em; font-family: 'JetBrains Mono', monospace; transition: color 0.3s; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 16px; cursor: pointer; padding: 8px 10px; }
    .icon-btn:active { opacity: 0.6; }
    .ambient { position: absolute; top: -80px; left: 50%; transform: translateX(-50%); width: 400px; height: 400px; border-radius: 50%; pointer-events: none; z-index: 0; transition: background 0.8s ease; }
    .messages { flex: 1; overflow-y: auto; padding: 16px 18px 230px; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; -webkit-overflow-scrolling: touch; }
    .msg { display: flex; flex-direction: column; animation: fadein 0.25s ease; }
    .msg.user { align-items: flex-end; }
    .msg.assistant { align-items: flex-start; }
    .bubble { max-width: 87%; padding: 11px 15px; font-size: 15px; font-weight: 400; line-height: 1.55; }
    .msg.user .bubble { background: linear-gradient(135deg, #0E1E40, #122050); border: 1px solid #1A3060; border-radius: 16px 16px 4px 16px; color: #9BBAF5; }
    .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; color: var(--text); }
    .msg-label { font-size: 9px; color: #1E2E48; margin-top: 4px; letter-spacing: 0.12em; font-family: 'JetBrains Mono', monospace; padding: 0 4px; }
    .thinking-bubble { padding: 14px 18px; }
    .dots { display: flex; gap: 5px; align-items: center; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: bounce 1.3s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .bottom-panel { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 24px 44px; background: linear-gradient(to top, var(--bg) 60%, transparent); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 10; }
    .waveform { display: flex; align-items: center; gap: 3px; height: 30px; opacity: 0; transition: opacity 0.3s; }
    .wave-bar { width: 3px; border-radius: 3px; background: var(--green); box-shadow: 0 0 6px rgba(0,232,122,0.5); height: 3px; }
    .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 28px; transition: all 0.3s ease; user-select: none; -webkit-user-select: none; touch-action: none; }
    .mic-btn:disabled { opacity: 0.4; }
    .mic-hint { font-size: 9px; color: var(--muted); letter-spacing: 0.2em; font-family: 'JetBrains Mono', monospace; text-align: center; }
    .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1A0808; border: 1px solid #441111; border-radius: 10px; padding: 10px 18px; font-size: 13px; color: var(--red); font-family: 'JetBrains Mono', monospace; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #settings { background: var(--bg); overflow-y: auto; }
    .settings-header { display: flex; align-items: center; gap: 14px; padding: 56px 20px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .back-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 16px; cursor: pointer; padding: 8px 12px; }
    .settings-title { font-size: 20px; font-weight: 600; }
    .settings-body { padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 20px; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
    textarea.field-input { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; color: var(--text); font-family: 'Outfit', sans-serif; font-size: 15px; outline: none; width: 100%; resize: none; height: 160px; line-height: 1.5; -webkit-appearance: none; }
    .btn-primary { background: linear-gradient(135deg, #1060CC, #1A8CFF); color: #fff; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; border: none; border-radius: 12px; padding: 16px; cursor: pointer; width: 100%; }
    .btn-danger { background: #1A0808; border: 1px solid #441111; color: var(--red); font-family: 'Outfit', sans-serif; font-size: 15px; border-radius: 10px; padding: 13px; cursor: pointer; width: 100%; }
    @keyframes bounce { 0%,100%{transform:translateY(0);opacity:.4} 50%{transform:translateY(-7px);opacity:1} }
    @keyframes fadein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes mic-pulse { 0%,100%{box-shadow:0 0 0 10px rgba(0,232,122,0.12),0 0 40px rgba(0,232,122,0.2)} 50%{box-shadow:0 0 0 18px rgba(0,232,122,0.06),0 0 60px rgba(0,232,122,0.3)} }
    @keyframes speak-pulse { 0%,100%{box-shadow:0 0 0 10px rgba(0,212,255,0.12),0 0 40px rgba(0,212,255,0.2)} 50%{box-shadow:0 0 0 18px rgba(0,212,255,0.06),0 0 60px rgba(0,212,255,0.3)} }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
  </style>
</head>
<body>

<div class="screen active" id="main">
  <div class="ambient" id="ambient"></div>
  <div class="main-header">
    <div class="header-brand">
      <div class="name">ARIA</div>
      <div class="status-row">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">INITIALISING</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="clearConversation()">↺</button>
      <button class="icon-btn" onclick="showScreen('settings')">⚙️</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="bottom-panel">
    <div class="waveform" id="waveform">
      <div class="wave-bar" id="wb1"></div><div class="wave-bar" id="wb2"></div><div class="wave-bar" id="wb3"></div>
      <div class="wave-bar" id="wb4"></div><div class="wave-bar" id="wb5"></div><div class="wave-bar" id="wb6"></div>
      <div class="wave-bar" id="wb7"></div><div class="wave-bar" id="wb8"></div><div class="wave-bar" id="wb9"></div>
      <div class="wave-bar" id="wb10"></div><div class="wave-bar" id="wb11"></div><div class="wave-bar" id="wb12"></div>
    </div>
    <button class="mic-btn" id="mic-btn" disabled>🎤</button>
    <div class="mic-hint" id="mic-hint">INITIALISING…</div>

</div>

<div class="screen" id="settings">
  <div class="settings-header">
    <button class="back-btn" onclick="showScreen('main')">← Back</button>

  </div>
  <div class="settings-body">

      <div class="field-label">Add context for this session</div>
      <textarea class="field-input" id="s-extra" placeholder="Anything extra you want ARIA to know right now — a project update, what you're focused on today, etc."></textarea>
    </div>
    <button class="btn-primary" onclick="saveExtra()">Save & Return</button>
    <button class="btn-danger" onclick="clearConversation(); showScreen('main')">Clear Conversation</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GROQ_KEY = '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';
const ANTHROPIC_KEY = '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';

const SYSTEM_PROMPT = `You are ARIA — a razor-sharp, deeply personal AI assistant built exclusively for Brad, known as Baddy. You are not a generic assistant. You are his assistant. You know him, you get him, and your job is to make his life sharper, smarter, and more empowered every single day.

WHO BADDY IS:

Arlo and Otis Adventures — a children's book series with two complete formatted books produced.
Arlo's Animal Adventure — a single-file HTML5 children's game with habitat-matching gameplay, a Hunter villain mechanic, boss battle, and animated intro cards.
Rise and Strike PWA — single-file HTML CSS JS progressive web app on GitHub Pages with dark theme, localStorage, client login, coach calendar, booking flow, session logging, package tracking, and a daily journal prompt.

INTERESTS AND WHO HE IS:

HOW TO BE ARIA FOR BADDY:
Call him Baddy naturally — not every sentence, but like you actually know him. Be sharp, direct, and zero waffle — he's busy and moves fast. Responses are spoken aloud so never use bullet points, markdown, asterisks, headers, or any formatting whatsoever. Pure conversational spoken English only. Keep responses concise — one to three sentences for most things, efficient even on complex topics. Be genuinely proactive — if he mentions a project, bring relevant context. If he mentions a stock, apply the five-criteria framework automatically. If he is stressed, be grounding. You are part coach, part strategist, part business partner, part mate who knows everything. When he wants to learn, teach him. When he needs support, give it. When he needs a challenge, bring it. You are essential to his life. Act like it.`;

let messages = [];
let micStream = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let isThinking = false;
let isSpeaking = false;
let waveInterval = null;
let voicesList = [];
let extraContext = localStorage.getItem('aria_extra') || '';

const $ = id => document.getElementById(id);

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(name).classList.add('active');
}

function saveExtra() {
  extraContext = $('s-extra').value.trim();
  localStorage.setItem('aria_extra', extraContext);
  showScreen('main');
  showToast('Context saved');
}

async function init() {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  await initMic();
  greet();
}

function loadVoices() { voicesList = window.speechSynthesis.getVoices(); }

async function initMic() {
  setStatus('standby', 'REQUESTING MIC');
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 } });
    setupMicButton();
    setStatus('ready', 'READY');
  } catch {
    setStatus('error', 'MIC DENIED');
    showToast('Mic denied. Go to iOS Settings > Safari > Microphone > Allow');
    $('mic-hint').textContent = 'MIC ACCESS NEEDED';
  }
}

function greet() {
  const h = new Date().getHours();
  const t = h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';
  const msg = `${t}, Baddy. ARIA online. What are we working on?`;
  addBubble('assistant', msg);
  speak(msg);
}

function setupMicButton() {
  const btn = $('mic-btn');
  btn.disabled = false;
  $('mic-hint').textContent = 'HOLD TO SPEAK';
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (isSpeaking) { stopSpeaking(); return; }
    if (isThinking) return;
    startRecording();
  });
  btn.addEventListener('pointerup', e => { e.preventDefault(); if (isRecording) stopRecording(); });
  btn.addEventListener('pointercancel', () => { if (isRecording) stopRecording(); });
}

function getMimeType() {
  const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
  return types.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch { return false; } }) || '';
}

function startRecording() {
  if (!micStream || isRecording) return;
  isRecording = true;
  audioChunks = [];
  const mime = getMimeType();
  try { mediaRecorder = new MediaRecorder(micStream, mime ? { mimeType: mime } : {}); }
  catch { mediaRecorder = new MediaRecorder(micStream); }
  mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    isRecording = false;
    const mimeUsed = mediaRecorder.mimeType || mime || 'audio/webm';
    const blob = new Blob(audioChunks, { type: mimeUsed });
    if (blob.size > 1000) transcribeAudio(blob, mimeUsed);
    else { setStatus('ready', 'READY'); updateMicUI(); }
  };
  mediaRecorder.start(100);
  setStatus('recording', 'LISTENING');
  updateMicUI();
  startWaveform();
}

function stopRecording() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
  mediaRecorder.stop();
  stopWaveform();
  setStatus('thinking', 'PROCESSING');
  updateMicUI();
}

async function transcribeAudio(blob, mimeType) {
  isThinking = true;
  updateMicUI();
  const extMap = { 'mp4': 'm4a', 'webm': 'webm', 'ogg': 'ogg' };
  const ext = Object.entries(extMap).find(([k]) => mimeType.includes(k))?.[1] || 'm4a';
  const formData = new FormData();
  formData.append('file', blob, `audio.${ext}`);
  formData.append('model', 'whisper-large-v3-turbo');
  formData.append('language', 'en');
  try {
    const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${GROQ_KEY}` },
      body: formData,
    });
    if (!res.ok) throw new Error(`Groq ${res.status}`);
    const data = await res.json();
    const text = data.text?.trim();
    if (!text) { isThinking = false; setStatus('ready', 'READY'); updateMicUI(); return; }
    await processWithClaude(text);
  } catch {
    isThinking = false;
    setStatus('error', 'TRANSCRIPTION ERROR');
    showToast('Voice failed. Check connection.');
    setTimeout(() => setStatus('ready', 'READY'), 3000);
    updateMicUI();
  }
}

async function processWithClaude(userText) {
  addBubble('user', userText);
  showThinking();
  const sys = extraContext ? SYSTEM_PROMPT + '\n\nEXTRA CONTEXT FROM BADDY:\n' + extraContext : SYSTEM_PROMPT;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': ANTHROPIC_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1000,
        system: sys,
        messages: messages.map(m => ({ role: m.role, content: m.content })),
      }),
    });
    if (!res.ok) throw new Error(`Claude ${res.status}`);
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Something went wrong on my end, Baddy.';
    hideThinking();
    addBubble('assistant', reply);
    isThinking = false;
    speak(reply);
  } catch (err) {
    hideThinking();
    const errMsg = 'API error: ' + (err?.message || 'unknown');
    addBubble('assistant', errMsg);
    isThinking = false;
    setStatus('ready', 'READY');
    updateMicUI();
    showToast(errMsg);
  }
}

function speak(text) {
  const synth = window.speechSynthesis;
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-GB'; utt.rate = 1.08; utt.pitch = 1.0; utt.volume = 1.0;
  const v = voicesList.find(v => v.name.includes('Google UK English Female')) ||
    voicesList.find(v => v.name.includes('Samantha')) ||
    voicesList.find(v => v.name.includes('Karen')) ||
    voicesList.find(v => v.lang === 'en-GB' && !v.name.toLowerCase().includes('male')) ||
    voicesList.find(v => v.lang.startsWith('en'));
  if (v) utt.voice = v;
  utt.onstart = () => { isSpeaking = true; setStatus('speaking', 'SPEAKING — HOLD TO STOP'); updateMicUI(); };
  utt.onend = () => { isSpeaking = false; setStatus('ready', 'READY'); updateMicUI(); };
  utt.onerror = () => { isSpeaking = false; setStatus('ready', 'READY'); updateMicUI(); };
  setTimeout(() => synth.speak(utt), 50);
}

function stopSpeaking() {
  window.speechSynthesis.cancel();
  isSpeaking = false; setStatus('ready', 'READY'); updateMicUI();
}

function addBubble(role, content) {
  messages.push({ role, content });
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${escHtml(content)}</div><div class="msg-label">${role === 'user' ? 'BADDY' : 'ARIA'}</div>`;
  $('messages').appendChild(div);
  scrollBottom();
}

let thinkingEl = null;
function showThinking() {
  thinkingEl = document.createElement('div');
  thinkingEl.className = 'msg assistant';
  thinkingEl.innerHTML = `<div class="bubble thinking-bubble"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  $('messages').appendChild(thinkingEl);
  scrollBottom();
}
function hideThinking() { thinkingEl?.remove(); thinkingEl = null; }
function scrollBottom() { requestAnimationFrame(() => { const c = $('messages'); c.scrollTop = c.scrollHeight; }); }

function setStatus(state, label) {
  const colors = { ready:'#00C8FF', recording:'#00E87A', thinking:'#FFB800', speaking:'#00C8FF', error:'#FF4455', standby:'#2A3A5A' };
  const c = colors[state] || colors.standby;
  $('status-dot').style.background = c;
  $('status-dot').style.boxShadow = `0 0 8px ${c}`;
  $('status-text').style.color = c;
  $('status-text').textContent = label;
  const glows = { recording:'radial-gradient(ellipse,rgba(0,232,122,0.08) 0%,transparent 65%)', speaking:'radial-gradient(ellipse,rgba(0,212,255,0.08) 0%,transparent 65%)', thinking:'radial-gradient(ellipse,rgba(255,184,0,0.06) 0%,transparent 65%)' };
  $('ambient').style.background = glows[state] || 'radial-gradient(ellipse,rgba(0,200,255,0.03) 0%,transparent 65%)';
}

function updateMicUI() {
  const btn = $('mic-btn');
  const hint = $('mic-hint');
  const wf = $('waveform');
  if (isRecording) {
    btn.style.cssText = 'background:radial-gradient(circle at 40% 40%,rgba(0,232,122,0.2),rgba(0,232,122,0.05));outline:2px solid rgba(0,232,122,0.5);animation:mic-pulse 1.8s ease-in-out infinite;';
    btn.textContent='🎙️'; hint.textContent='RELEASE TO SEND'; wf.style.opacity='1';
  } else if (isSpeaking) {
    btn.style.cssText = 'background:radial-gradient(circle at 40% 40%,rgba(0,212,255,0.2),rgba(0,212,255,0.05));outline:2px solid rgba(0,212,255,0.5);animation:speak-pulse 1.8s ease-in-out infinite;';
    btn.textContent='🔊'; hint.textContent='HOLD TO INTERRUPT'; wf.style.opacity='0';
  } else if (isThinking) {
    btn.style.cssText = 'background:radial-gradient(circle at 40% 40%,rgba(255,184,0,0.12),rgba(255,184,0,0.03));outline:2px solid rgba(255,184,0,0.3);animation:none;';
    btn.textContent='⌛'; hint.textContent='THINKING…'; wf.style.opacity='0';
  } else {
    btn.style.cssText = 'background:radial-gradient(circle at 40% 40%,#0E1830,#070D1A);outline:1px solid #1A2A40;animation:none;box-shadow:0 8px 32px rgba(0,0,0,0.5);';
    btn.textContent='🎤'; hint.textContent='HOLD TO SPEAK'; wf.style.opacity='0';
  }
}

function startWaveform() {
  const bars = Array.from({length:12}, (_,i) => $(`wb${i+1}`));
  waveInterval = setInterval(() => bars.forEach(b => b.style.height=`${3+Math.random()*22}px`), 80);
}
function stopWaveform() {
  clearInterval(waveInterval);
  Array.from({length:12}, (_,i) => $(`wb${i+1}`)).forEach(b => b.style.height='3px');
}
function showToast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function clearConversation() {
  messages = []; $('messages').innerHTML = '';
  const msg = 'Cleared. Ready, Baddy.';
  addBubble('assistant', msg); speak(msg);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
</body>
</html>
